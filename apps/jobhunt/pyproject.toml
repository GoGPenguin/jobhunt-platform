[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal job-hunt platform: collect, rank, summarize and tailor job applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
jobhunt = "jobhunt.cli:run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "N",            # naming
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "RUF",          # ruff-specific
    "S",            # security (bandit)
    "DTZ",          # timezone-naive datetimes
    "PT",           # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest tests work
"src/jobhunt/domain/codes/*.py" = ["SIM905"]  # generated lists stay compact as split strings
"src/jobhunt/domain/language.py" = ["SIM905"]  # word lists stay compact as split strings
"tests/notify/test_digest.py" = ["RUF001"]  # expected digest text uses real en dashes
"tests/profile/test_master_cv.py" = ["RUF001"]  # figures like 30–80% use real en dashes

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

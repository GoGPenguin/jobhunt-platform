name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same interpreter as the dev machine: the exact version in apps/jobhunt/.python-version,
      # downloaded by uv, never the runner's system Python.
      UV_PYTHON_PREFERENCE: only-managed
      # Store tests run against the service below (a throwaway server, CI-only password).
      JOBHUNT_TEST_DATABASE_ADMIN_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    services:
      postgres:
        # Same image as docker-compose.yml (PostgreSQL 18.6 + pgvector 0.8.7), pinned by digest.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: apps/jobhunt/uv.lock

      - name: Install from uv.lock
        run: make install

      - name: Lint, type check, test, schema drift
        run: make check
